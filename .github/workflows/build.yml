name: Build Zalo for Arch Linux

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      zalo_version:
        description: 'Zalo Version (leave empty for latest)'
        required: false
        default: ''
        type: string
      zalo_win_version:
        description: 'Zalo Windows Version for the call engine (leave empty for latest)'
        required: false
        default: ''
        type: string
      zadark_version:
        description: 'ZaDark Version/Tag/Commit (leave empty for latest)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
        
    - name: Cache Electron binaries
      uses: actions/cache@v3
      with:
        path: ~/.cache/electron
        key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-electron-

    - name: Cache build downloads (DMG, Windows installer, call engine)
      uses: actions/cache@v3
      with:
        path: temp
        key: ${{ runner.os }}-zalo-temp-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-zalo-temp-

    - name: Cache Cargo registry and build artifacts
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          nativelibs/*/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('nativelibs/*/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Install Node.js dependencies
      run: npm ci --prefer-offline --no-audit

    - name: Install system build dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y liblzma-dev p7zip-full gcc-mingw-w64-i686 gcc gcc-multilib libc6-dev-i386 libx11-dev libxcb1-dev libx11-dev:i386 libxcb1-dev:i386 libxext-dev:i386 zstd libarchive-tools

    - name: Setup App and Compile Native Addons
      env:
        ZALO_VERSION: ${{ github.event.inputs.zalo_version }}
        ZALO_WIN_VERSION: ${{ github.event.inputs.zalo_win_version }}
        ZADARK_VERSION: ${{ github.event.inputs.zadark_version }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        SETUP=true node scripts/main.js

    - name: Build Native Arch Linux Package
      id: build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        node scripts/build-arch.js
        cd dist
        sha256sum zalo-for-linux-*.pkg.tar.zst > sha256sums.txt
        echo "commit_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        
    - name: Upload Arch Linux Package Artifact
      if: steps.build.outputs.build == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.build.outputs.pkg_name }}
        path: ${{ steps.build.outputs.pkg_file }}
        retention-days: 30

    - name: Upload Checksums Artifact
      if: steps.build.outputs.build == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: sha256sums.txt
        path: dist/sha256sums.txt
        retention-days: 30

    - name: Create Release
      if: steps.build.outputs.build == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.build.outputs.zalo_version }}
        name: Zalo for Linux v${{ steps.build.outputs.zalo_version }}
        body: |
          ## Arch Linux Installation

          ### 1. One-line install with pacman:
          ```bash
          sudo pacman -U https://github.com/${{ github.repository }}/releases/download/${{ steps.build.outputs.zalo_version }}/${{ steps.build.outputs.pkg_name }}
          ```

          ### 2. Download and install manually:
          ```bash
          curl -L -O https://github.com/${{ github.repository }}/releases/download/${{ steps.build.outputs.zalo_version }}/${{ steps.build.outputs.pkg_name }}
          sudo pacman -U ${{ steps.build.outputs.pkg_name }}
          ```

          ### 3. Build from source via makepkg:
          ```bash
          git clone https://github.com/${{ github.repository }}.git
          cd zalo-omarchy/packaging/arch
          makepkg -si
          ```

          ---

          ## Optional Dependencies (Voice & Video Calls)
          ```bash
          sudo pacman -S --needed wine lib32-glibc lib32-alsa-lib lib32-libpulse lib32-gstreamer
          ```

          ## SHA256 Checksums
          See attached `sha256sums.txt`.
        files: |
          ${{ steps.build.outputs.pkg_file }}
          dist/sha256sums.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Cleanup old release assets
      if: steps.build.outputs.build == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ steps.build.outputs.zalo_version }}
        CURRENT_COMMIT: ${{ steps.build.outputs.commit_hash }}
      run: |
        set -euo pipefail

        echo "Cleaning up assets for release $RELEASE_TAG (keeping commit $CURRENT_COMMIT)"

        asset_names=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' || true)

        if [ -z "$asset_names" ]; then
          echo "No assets found for release $RELEASE_TAG"
          exit 0
        fi

        for name in $asset_names; do
          if [[ "$name" == *.AppImage ]]; then
            echo "Removing old AppImage asset: $name"
            gh release delete-asset "$RELEASE_TAG" "$name" --yes
          fi
        done
